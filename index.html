<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor de Musica</title>
  <!-- Vinculación al archivo CSS con los estilos -->
  <link rel="stylesheet" href="style.css">
  <!-- Importación de iconos de Bootstrap (para los botones de control) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
  <!-- Contenedor principal del reproductor -->
  <div class="player">

    <!-- Carátula de la canción -->
    <div class="caratula">
      <img id="song-caratula" src="" alt="Carátula de la canción">
    </div>

    <!-- Información de la canción (nombre y autor) -->
    <div class="song-info">
      <h2 id="song-name">Canción</h2>
      <p id="song-author">Artista</p>
    </div>

    <!-- Elemento de audio oculto que reproduce la música -->
    <audio id="audio-player"></audio>

    <!-- Controles de reproducción -->
    <div class="controls">
      <!-- Botón de canción anterior -->
      <button id="btn-prev"><i class="bi bi-skip-backward-fill"></i></button>
      <!-- Botón de play/pause -->
      <button id="btn-play"><i id="btn-play-icon" class="bi bi-play-fill"></i></button>
      <!-- Botón de canción siguiente -->
      <button id="btn-next"><i class="bi bi-skip-forward-fill"></i></button>
      <!-- Botón de repetir canción -->
      <button id="btn-repeat"><i class="bi bi-repeat"></i></button>
    </div>

    <!-- Barra de progreso de la canción -->
    <div class="progress">
      <!-- Tiempo actual de reproducción -->
      <span id="player-current-time">0:00</span>
      <!-- Slider para avanzar/retroceder en la canción -->
      <input type="range" id="player-progress" value="0" min="0" step="1">
      <!-- Duración total de la canción -->
      <span id="player-duration">0:00</span>
    </div>

    <!-- Control de volumen -->
    <div class="volume">
      <!-- Botón de mute/activar volumen -->
      <button id="btn-volume"><i class="bi bi-volume-up-fill"></i></button>
      <!-- Slider para ajustar el volumen -->
      <input type="range" id="player-volume" min="0" max="1" step="0.1" value="1">
    </div>
  </div>

  <!-- Archivo JavaScript que contiene la lógica del reproductor -->
  <script src="main.js"></script>
</body>
</html>
